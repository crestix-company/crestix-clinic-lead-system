taxonomy_version: 7A-v3
previous_taxonomy_version: 7A-v2
legacy_taxonomy_status: DEPRECATED_COMPATIBILITY_SNAPSHOT
taxonomy_change_log:
- Add department-context guards for ambiguous cross-specialty aliases while preserving explicit treatment-name rescue.
- Split disease/department labels from treatment, examination, procedure, and surgery categories.
- Added a separate clinical_focus axis for disease and specialty-focus signals.
- Restricted Phase 7-B eligibility to status ACTIVE and sales_filter_value HIGH or MEDIUM.
- Preserved the complete 7A-v1 19-category definition and 112 sales options as compatibility history.
source_of_truth_note: Canonical Phase 7 treatment taxonomy. Department context never
  implies treatment delivery.
statuses:
  CONFIRMED: Official clinic website clearly says this clinic provides the treatment.
  REVIEW: Mention exists but provider/context is ambiguous.
  NOT_CONFIRMED: No qualifying evidence found; does not mean unavailable.
evidence_schema:
  required_fields:
  - clinic_id
  - treatment_category
  - status
  - evidence_text
  - evidence_url
  - evidence_page_title
  - evidence_source_type
  - checked_at
  - rule_version
rules:
  official_site_only: true
  positive_requires_clinic_provider_and_offer: true
  diagnosis_never_implies_treatment: true
  substring_match_never_confirms: true
  negative_patterns:
  - 行っていません
  - 行っておりません
  - 実施していません
  - 実施しておりません
  - 対応していません
  - 対応しておりません
  - 提供していません
  - 取り扱っていません
  - 施術していません
  - 検査していません
  - 他院をご紹介
  - 他院に紹介
  - 他の医療機関へ紹介
  review_contexts:
  - 一般医学解説
  - 紹介先・他院
  - 過去記事・ニュース
  - 提供主体不明
  official_url_predicate: src.enrichment.hp_analysis.is_official_candidate
phase_7b_sampling:
  target_unique_clinics: 270
  acceptable_unique_clinic_range: [200, 300]
  per_active_treatment_category_minimum_candidate_rows: 6
  likely_positive_candidate_rows_per_category: 2
  likely_negative_candidate_rows_per_category: 4
  positive_candidate_basis: Legacy treatment evidence/category or documented procedure-specific HP link; sampling stratum only, never a confirmed label.
  negative_candidate_basis: Same sales department with no corresponding legacy treatment category; candidate only, never a NOT_CONFIRMED decision.
  http_requests_in_phase_7a_2: 0
  phase_7b_started: false
  overlap_policy: Stratify within active treatment categories, then deduplicate clinic IDs while retaining category-membership rows; refill until each ACTIVE category has positive and negative candidates.
  strata:
  - HP identity verified
  - Maps website URL available
  - MHLW department matches sales category
  - multi-department clinic
  - large multi-page official site
  - small official site
  human_audit_target: 30
  metrics:
  - confirmed_precision
  - review_rate
  - not_confirmed_rate
  - alias_hit_rate
  - false_positive_count
  - negative_sentence_false_positive_count
  - categories_per_clinic
  - page_fetch_success_rate
  - processing_seconds_per_clinic
  - http_requests_per_clinic
phase_7c_gate: Do not start full research until Phase 7-B false positives, misses,
  and REVIEW rate are reviewed.
