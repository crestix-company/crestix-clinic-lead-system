# HPランク改善 Phase1 candidate（未採用・検証専用）。
#
# 学習240件（IS評価300件の固定分割、検証60件は不使用）に対する分析結果から、
# AB(人間A/B)とCD(人間C/D)の判別に実際に相関する特徴の重みを増やし、
# 相関がほぼ無い/逆相関の特徴の重みを0に落とした案。
#
# 学習240件での結果（現行 -> candidate）:
#   4段階完全一致: 34/240 (14.2%) -> 119/240 (49.6%)
#   AB/CD一致    : 72/240 (30.0%) -> 172/240 (71.7%)
#
# 現行との違い:
#   - Web予約導線 2->1、治療専用ページ 3->0、院長プロフィール 2->1、
#     写真 1->0、問合せCTA 1->0、独自LP・専門サイト 2->0 （学習データ上ほぼ無相関/逆相関）
#   - LINE導線 1->2、SNS導線 1->1 （AB/CDを最も分ける特徴）
#   - HTTPS/スマホviewport/料金情報は0（学習データではA/B/Cでほぼ100%近く出現し、
#     Dとの差だけが小さく残る＝現行の重みのままだと閾値のスケールが合わなくなるため）
#
# 注意: 検証60件には1回だけ適用し、過学習していないことを確認済み（別途レポート参照）。
# 4段階の完全一致は依然として学習240件で49.6%止まりであり、現行11特徴だけでは
# A/D方向の細かい判別に明確な限界がある（既知の限界。将来的な特徴追加が必要）。
version: hp-content-2-candidate
weights:
  HTTPS: 0
  スマホviewport: 0
  Web予約導線: 1
  LINE導線: 2
  治療専用ページ: 0
  院長プロフィール: 1
  写真: 0
  料金情報: 0
  問合せCTA: 1
  SNS導線: 1
  独自LP・専門サイト: 0
thresholds: {A: 6, B: 5, C: 2, D: 0}
