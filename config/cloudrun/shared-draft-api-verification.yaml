# Template only. Do not apply to an existing service. Replace placeholders only
# in an isolated non-production project after separate deployment approval.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shared-draft-api-verification
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: shared-draft-api-verification@REPLACE_NONPROD_PROJECT.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/REPLACE_NONPROD_PROJECT/REPLACE_REPOSITORY/shared-draft-api:phase-d
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SHARED_DRAFT_API_RUNTIME_ENABLED
              value: "true"
            - name: PORT
              value: "8080"
            - name: SHARED_DRAFT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-draft-verification-database-url
                  key: latest
            - name: SHARED_DRAFT_API_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: shared-draft-verification-api-tokens
                  key: latest
            - name: GMAIL_DWD_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: shared-draft-verification-gmail-dwd
                  key: latest
            - name: SHARED_DRAFT_GMAIL_MAILBOX
              value: "REPLACE_WITH_NONPROD_GMAIL_MAILBOX"
            - name: SHARED_DRAFT_GMAIL_TIMEOUT_SECONDS
              value: "20"
            - name: SHARED_DRAFT_LEASE_SECONDS
              value: "90"
            - name: SHARED_DRAFT_RATE_LIMIT
              value: "30"
            - name: SHARED_DRAFT_RATE_WINDOW_SECONDS
              value: "60"
