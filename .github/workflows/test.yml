name: Python validation

on:
  pull_request:
    branches:
      - main
      - feat/outreach-gas-sheet-bridge-phase1
      - feat/gmail-history-backfill-dedup-328-20261019
      - feat/cloudrun-comdesk-import-writer-path-20261020
      - feat/cloudrun-maps-import-writer-path-20261020
      - feat/cloudrun-maps-collection-orchestration-20261020
      - feat/cloudrun-hp-email-parity-20261020
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile Python sources
        run: python -m compileall -q app_v2.py src scripts mhlw_dry_run

      - name: Import application entrypoint
        run: python -c "import app_v2"
