name: Tests

on:
  pull_request:
    branches:
      - main
      - feat/outreach-gas-sheet-bridge-phase1
      - feat/gmail-history-backfill-dedup-328-20261019
      - feat/cloudrun-comdesk-import-writer-path-20261020
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Build Cloud Run images
        run: |
          docker build --file Dockerfile.cloudrun --tag clinic-cloudrun:ci .
          if [ -f Dockerfile.cloudrun.worker ]; then
            docker build --file Dockerfile.cloudrun.worker --tag clinic-hp-worker:ci .
          fi
          if [ -f Dockerfile.cloudrun.email-worker ]; then
            docker build --file Dockerfile.cloudrun.email-worker --tag clinic-email-worker:ci .
          fi
